<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>页面重定向 - SNILAB</title>
  <script>
    // GitHub Pages 404 处理：重定向客户端路由到正确的页面
    (function() {
      const pathname = window.location.pathname;
      
      // 处理产品详情页路由：/products/{productId} 或 /products/{productId}/
      // 现在构建时会为每个产品生成 /products/{productId}/index.html
      const productMatch = pathname.match(/^\/products\/([^\/\?]+)\/?(\?.*)?$/);
      if (productMatch) {
        const productId = productMatch[1];
        // 移除 index.html 等文件扩展名
        if (productId.includes('.')) {
          // 如果 productId 包含点，可能是 index.html 或其他文件，直接跳转到首页
          window.location.href = '/';
          return;
        }
        
        // 直接重定向到目录路径（静态服务器会自动查找 index.html）
        // 如果文件不存在，则重定向到查询参数方式作为后备
        if (!pathname.endsWith('/')) {
          // 如果 URL 不带尾部斜杠，先尝试带斜杠的路径
          window.location.href = `/products/${productId}/`;
        } else {
          // 如果已经在带斜杠的路径上但文件不存在，使用查询参数方式
          // 延迟一点执行，避免立即跳转
          setTimeout(() => {
            window.location.href = `/products/index.html?productId=${productId}`;
          }, 100);
        }
        return;
      }
      
      // 处理保修条款页路由：/warranty 或 /warranty/
      if (pathname === '/warranty' || pathname === '/warranty/') {
        // 直接重定向到 /warranty/index.html（文件应该存在）
        window.location.href = '/warranty/index.html';
        return;
      }
      
      // 其他情况，重定向到首页
      window.location.href = '/';
    })();
  </script>
</head>
<body>
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div style="text-align: center;">
      <h1>正在跳转...</h1>
      <p>如果页面没有自动跳转，请 <a href="/">点击这里返回首页</a></p>
    </div>
  </div>
</body>
</html>
